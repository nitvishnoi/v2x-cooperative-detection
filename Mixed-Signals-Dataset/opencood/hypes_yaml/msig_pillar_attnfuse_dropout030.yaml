# Structured CAV-dropout fine-tune, starting from epoch 55 of
# msig_pillar_attnfuse_local.yaml. Only the training exposure to missing
# CAVs changes here - anchors, NMS, score threshold, DOME/coordinate
# transforms, and architecture are all untouched, copied verbatim from the
# submitted config. Each CAV (laser, 003, 004) is dropped independently at
# random with probability node_dropout_p during training only; TOP+DOME
# are never dropped, and validation/eval always sees the natural node set
# (see MSigIntermediateFusion._sample_node_dropout - dropout is already
# gated on self.is_train).
name: msig_pillar_attnfuse_dropout030

dataset:
  data_root: '/home/nitin/Nitin/LaneDetection/v2x-cooperative-detection/data/mixed-signals'
  flag_train: False
  flag_verbose: False
  flag_pad_agent_indicator: False
  path_gt_infos:
    train: /home/nitin/Nitin/LaneDetection/v2x-cooperative-detection/data/mixed-signals/train_gt_infos.pkl
    test: /home/nitin/Nitin/LaneDetection/v2x-cooperative-detection/data/mixed-signals/test_gt_infos.pkl

  yaml_parser: "load_point_pillar_params"

  fusion:
    core_method: MSigIntermediateFusion

  num_classes: &num_classes 3
  name_classes: &name_classes ['car', 'bike', 'pedestrian']
  num_point_features: &num_point_features 4  # [x, y, z, intensity]

  # structured CAV dropout - the only real change in this config
  data_augment:
    - NAME: random_node_dropout
  node_dropout_p: 0.30

train_params:
  batch_size: &batch_size 1
  batch_size_per_gpu: 1  # distributed training
  epoches: 65  # resuming at 55 -> up to 10 new epochs (56-65), stop early if guardrails trip
  eval_freq: 1
  save_freq: 1

preprocess:
  core_method: &preprocessor_name 'SpVoxelPreprocessor'
  args:
    voxel_size: &voxel_size [0.2, 0.2, 7]
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
    num_point_features: *num_point_features

  # lidar range for each individual cav.
  cav_lidar_range: &cav_lidar [-51.2, -51.2, -6, 51.2, 51.2, 1]

postprocess:
  core_method: 'VoxelPostprocessorMulti'
  num_classes: *num_classes
  anchor_args:
    cav_lidar_range: *cav_lidar
    anchor_lwh: [[5.13, 2.12, 1.84], [1.76, 0.6, 1.73], [0.8, 0.6, 1.73]]  # car (ours), bike (kitti), ped (kitti)
    r: [0, 90]
    num_per_position: &num_per_position 2

  target_args:
    pos_threshold: 0.5  # to id positive anchor
    neg_threshold: 0.35  # to id negative anchor

  score_threshold: [0.2, 0.2, 0.2]  # car, bike, ped - unchanged from the submitted config

  order: 'hwl'

  max_num: 100 # maximum number of objects in a single frame.
  # use this number to make sure different frames has the same dimension in the same batch

  nms_thresh: [0.15, 0.15, 0.15]  # car, bike, ped - unchanged from the submitted config

model:
  core_method: point_pillar_intermediate

  args:
    voxel_size: *voxel_size
    lidar_range: *cav_lidar
    anchor_number: *num_per_position
    num_classes: *num_classes
    num_point_features: *num_point_features
    preprocessor_name: *preprocessor_name

    pillar_vfe:
      use_norm: true
      with_distance: false
      use_absolute_xyz: true
      num_filters: [64]

    point_pillar_scatter:
      num_features: 64

    base_bev_backbone: # where mid-fusion happens
      layer_nums: [3, 5, 8]
      layer_strides: [2, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]
      compression: 0

      use_freezed_rsu_downsampled_feat_maps: False

loss:
  core_method: point_pillar_loss_multi
  args:
    cls_weight: 1.0
    reg: 2.0
    num_classes: *num_classes
    name_classes: *name_classes

optimizer:
  core_method: Adam
  # epoch 55 was already past the first decay milestone (epoch 50, gamma
  # 0.3), so resuming needs the already-decayed LR set explicitly - the
  # --model_dir resume path only reloads model weights, not optimizer/
  # scheduler state (see ARCHITECTURE.md's "note on resuming").
  lr: 0.00015
  args:
    eps: 1e-10
    weight_decay: 1e-4

lr_scheduler:
  core_method: multistep
  gamma: 0.3
  step_size: [80]  # next real milestone is unreachable within this short fine-tune

debug_model: False
